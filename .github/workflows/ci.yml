# Restores, builds, tests, and packages the standalone Windows release on pull requests and pushes to main.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  build:
    name: Build, test, and package (Windows)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          skip-lts-prepass: true
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - name: Restore
        run: dotnet restore AnimeTierlist.slnx --locked-mode

      - name: Build
        run: dotnet build AnimeTierlist.slnx --no-restore -p:RestoreLockedMode=true

      - name: Test
        run: dotnet test --solution AnimeTierlist.slnx --no-build

      - name: Build standalone package
        shell: pwsh
        run: ./tools/release/Build-Release.ps1
